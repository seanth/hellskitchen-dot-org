<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Hey Alinas...bet you didn't learn this stuff</title>    <style>        * {            box-sizing: border-box;            margin: 0;            padding: 0;        }        body {            background-color: #ffffff;            font-family: system-ui, -apple-system, sans-serif;            min-height: 100vh;            display: flex;            flex-direction: column;            align-items: center;            justify-content: space-between;            padding: 2rem;        }        main {            flex: 1;            display: flex;            align-items: center;            justify-content: center;        }        #gallery-image {            max-width: 90vw;            max-height: 75vh;            object-fit: contain;            transition: opacity 0.5s ease-in-out;            opacity: 1;        }        #gallery-image.fading {            opacity: 0;        }        footer a {            color: #333;            text-decoration: none;            font-size: 0.9rem;        }        footer a:hover {            text-decoration: underline;        }    </style></head><body><main>    <img id="gallery-image" src="" alt="Randomized display image"></main><footer>    <a href="lnlcopy.html">Information on copyright...</a></footer><script>    // Images numbered 1 through N, where TOTAL_IMAGES is the total number of images    // Hey Sadie, you should probably convert everything to JPGs, huh?    const TOTAL_IMAGES = 50;    const images = Array.from({ length: TOTAL_IMAGES }, (_, i) => `${i + 1}.gif`);    const FOLDER = "livenlearn/";    const ROTATION_INTERVAL = 10000; // Time in milliseconds    const imgElement = document.getElementById("gallery-image");    let currentIndex = -1;    function getNextRandomIndex() {        if (images.length <= 1) return 0;        let newIndex;        // Prevent picking the exact same image twice in a row        do {            newIndex = Math.floor(Math.random() * images.length);        } while (newIndex === currentIndex);        return newIndex;    }    function changeImage() {        imgElement.classList.add("fading");        // Wait for fade-out transition to complete before swapping src        setTimeout(() => {            currentIndex = getNextRandomIndex();            imgElement.src = FOLDER + images[currentIndex];            imgElement.classList.remove("fading");        }, 500);    }    // Set initial image immediately on load    changeImage();    // Rotate images continuously while page is open    setInterval(changeImage, ROTATION_INTERVAL);</script></body></html>
