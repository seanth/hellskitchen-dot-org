<!DOCTYPE html><html lang="en"><link rel="stylesheet" href="/gdt/css/lnl.css"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Hey Alinas...bet you didn't learn this stuff</title></head><body><main>    <img id="gallery-image" src="" alt="Randomized gallery of live n learn images"></main><footer>    <a href="lnlcopy.html">Information on copyright...</a></footer><script>    // Images numbered 1 through N, where TOTAL_IMAGES is the total number of images    const TOTAL_IMAGES = 9;    const images = Array.from({ length: TOTAL_IMAGES }, (_, i) => `${i + 1}.jpg`);    const FOLDER = "livenlearn/";    const ROTATION_INTERVAL = 10000; // Time in milliseconds    const imgElement = document.getElementById("gallery-image");    let currentIndex = -1;    function getNextRandomIndex() {        if (images.length <= 1) return 0;        let newIndex;        // Prevent picking the exact same image twice in a row        do {            newIndex = Math.floor(Math.random() * images.length);        } while (newIndex === currentIndex);        return newIndex;    }    function changeImage() {        imgElement.classList.add("fading");        // Wait for fade-out transition to complete before swapping src        setTimeout(() => {            currentIndex = getNextRandomIndex();            imgElement.src = FOLDER + images[currentIndex];            imgElement.classList.remove("fading");        }, 500);    }    // Set initial image immediately on load    changeImage();    // Rotate images continuously while page is open    setInterval(changeImage, ROTATION_INTERVAL);</script></body></html>
