<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="/gdt/css/lnl.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hey Alinas...bet you didn't learn this stuff</title>
</head>
<body>

<main>
    <img id="gallery-image" src="" alt="Randomized gallery of live n learn images">
    <button id="playpause" onclick="timer.toggle()">Pause</button>
</main>

<footer>
    <a href="lnlcopy.html">Information on copyright...</a>
</footer>

<script>
    // Images numbered 1 through N, where TOTAL_IMAGES is the total number of images
    const TOTAL_IMAGES = 9;
    const images = Array.from({ length: TOTAL_IMAGES }, (_, i) => `${i + 1}.jpg`);

    const FOLDER = "livenlearn/";
    const ROTATION_INTERVAL = 10000; // Time in milliseconds

    const imgElement = document.getElementById("gallery-image");
    let currentIndex = -1;

    class Timer {
        constructor(startFunction, onStart, onStop, period) {
            this.startTime = Date.now();
            this.heldTime = 0;
            this.startFunction = startFunction;
            this.period = period;
            this.running = true;
            this.onStart = onStart;
            this.onStop = onStop;

            this.interval = setInterval(() => {
                this.startTime = Date.now();
                startFunction();
            }, period)
        }

        toggle() {
            if (this.running) {
                this.onStop();
                this.stop();
            }
            else {
                this.onStart();
                this.restart();
            }

            this.running = !this.running;
        }

        restart() {
            this.interval = setTimeout(() => {
                this.startTime = Date.now();
                this.startFunction();

                this.interval = setInterval(() => {
                    this.startTime = Date.now();
                    this.startFunction();
                }, this.period)
            },
            this.period - this.heldTime + this.startTime)
        }

        stop() {
            this.heldTime = Date.now();
            clearInterval(this.interval);
        }
    }

    function getNextRandomIndex() {
        if (images.length <= 1) return 0;
        let newIndex;
        // Prevent picking the exact same image twice in a row
        do {
            newIndex = Math.floor(Math.random() * images.length);
        } while (newIndex === currentIndex);
        return newIndex;
    }

    function changeImage() {
        currentIndex = getNextRandomIndex();
        imgElement.src = FOLDER + images[currentIndex];
        imgElement.classList.remove("fading");
    }

    function fadeToNextImage() {
        imgElement.classList.add("fading");

        // Wait for fade-out transition to complete before swapping src
        setTimeout(changeImage, 500);
    }

    // Set initial image immediately on load
    changeImage();

    let timer = new Timer(fadeToNextImage, () => {
        document.getElementById("playpause").innerHTML = "Pause";
    },
    () => {
        document.getElementById("playpause").innerHTML = "Play";
    },
    ROTATION_INTERVAL)
    
</script>

</body>
</html>
